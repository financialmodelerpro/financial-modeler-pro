<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B3A6B">
<title>You're offline | Financial Modeler Pro</title>
<!--
  The Modeling Hub's offline page (2026-09-24). Served by /sw.js when a page
  navigation fails for lack of a connection. Deliberately self-contained (no
  script, no external CSS, no font) because nothing else can load while
  offline. It asks the reader to check their connection and offers a retry. It
  shows NO figures and NO sign-in: the model lives on the server, so an
  offline session has nothing true to show, and a sign-in form cannot work
  without a connection.
  No em dashes in this file.
-->
<style>
  :root { color-scheme: light dark; --navy: #1B3A6B; --bg: #F5F7FA; --fg: #1F2937; --muted: #6B7280; --card: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F172A; --fg: #E5E7EB; --muted: #9CA3AF; --card: #111827; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { background: var(--card); max-width: 420px; width: 100%; border-radius: 14px; padding: 28px 24px;
          box-shadow: 0 6px 24px rgba(0,0,0,0.08); text-align: center; }
  img { width: 56px; height: 56px; border-radius: 12px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { font-size: 14px; line-height: 1.55; color: var(--muted); margin: 0 0 10px; }
  button { margin-top: 12px; background: var(--navy); color: #fff; border: 0; border-radius: 8px;
           padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <main class="card" role="alert">
    <img src="/pwa/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Financial Modeler Pro needs a connection: your models are kept on our servers, so nothing can be shown or saved without one.</p>
    <p>Please check your internet connection, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
